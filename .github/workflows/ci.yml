# geistkit CI: the same `make` targets on every platform, results as artifact and job summary.
# Self-hosted runners never run pull requests. A PR can change this file, so external
# contributors additionally need approval (repo setting: all_external_contributors).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.runner }} (container, offline)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: make ci JOBS=4
      - if: always()
        run: cat build/verify.txt >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no verify.txt" >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.runner }}
          path: |
            build/verify.txt
            build/results.tsv
            build/toolchain.txt
            build/logs/

  # Like pi5: enabled by the repository variable once a geistkit runner is registered and online.
  # Without the gate every push queues a job for 24 h and is then cancelled.
  # Both compilers here, on our own hardware: the hosted legs cover gcc-14, and
  # geist-memory's CI shows clang matters (its own matrix is gcc-14 + clang-19).
  amd-desktop:
    name: linux x86_64 (amd-desktop, ${{ matrix.cc }}, container, offline)
    if: github.event_name != 'pull_request' && vars.AMD_DESKTOP_RUNNER == 'on'
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-19]
    runs-on: [self-hosted, Linux, X64, amd-desktop]
    # One runner, so pushes and the nightly schedule would queue behind each other:
    # the newest state is the interesting one, cancel the older run.
    concurrency:
      group: amd-desktop-${{ matrix.cc }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # 16 of 32 threads: a local run at 12 took 315 s, while -j32 with the ASan
      # builds exhausted memory. Raise further only with a measured peak.
      - run: make ci JOBS=16 CC=${{ matrix.cc }}
      - if: always()
        run: cat build/verify.txt >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no verify.txt" >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-amd-desktop-${{ matrix.cc }}
          path: |
            build/verify.txt
            build/results.tsv
            build/toolchain.txt
            build/logs/

  # Enabled by the repository variable PI5_RUNNER=on once a geistkit runner is registered on the Pi.
  pi5:
    name: linux arm64 (Raspberry Pi 5, container, offline)
    if: github.event_name != 'pull_request' && vars.PI5_RUNNER == 'on'
    runs-on: [self-hosted, Linux, ARM64, pi5]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # MEMORY: the default 24g exceeds every Pi 5 model; raise it via the PI5_MEMORY variable if the board has more.
      - run: make ci JOBS=4 MEMORY=${{ vars.PI5_MEMORY || '6g' }}
      - if: always()
        run: cat build/verify.txt >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no verify.txt" >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-pi5
          path: |
            build/verify.txt
            build/results.tsv
            build/toolchain.txt
            build/logs/

  # Nightly only: the model-gated suites. Two fixtures (~1.9 GB) are fetched through
  # geistlib's pinned targets, cached by the lock file, and kept outside build/deps —
  # every `make fetch` wipes the clones, models included.
  nightly-models:
    name: linux x86_64 (models, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # versions.mk pins the engine revision, and that revision carries the model pins,
      # so the lock file is the honest cache key. One entry of ~1.9 GB, well inside the
      # repository's 10 GB budget (geistlib's cache thrashing is exactly what to avoid, TODO F10).
      - uses: actions/cache@v4
        with:
          path: build/models
          key: geistkit-models-${{ hashFiles('versions.mk') }}
      - run: make fetch-models
      - run: make ci MODELS=1 JOBS=4
      - if: always()
        run: cat build/verify.txt >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no verify.txt" >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-models
          path: |
            build/verify.txt
            build/results.tsv
            build/toolchain.txt
            build/logs/

  # No Docker on hosted macOS: native, toolchain from the matrix.
  macos:
    name: macos ${{ matrix.runner }} (${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        cc: [apple-clang, llvm@19]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          brew install libomp numpy ${{ matrix.cc == 'llvm@19' && 'llvm@19' || '' }}
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >>"$GITHUB_ENV"
          if [ '${{ matrix.cc }}' = llvm@19 ]; then
            echo "CC=$(brew --prefix llvm@19)/bin/clang" >>"$GITHUB_ENV"
            echo "ANALYZE_CC=$(brew --prefix llvm@19)/bin/clang" >>"$GITHUB_ENV"
          else
            echo "CC=clang" >>"$GITHUB_ENV"
            echo "ANALYZE_CC=clang" >>"$GITHUB_ENV"
          fi
      - run: make fetch
      - run: make verify JOBS=3
      - if: always()
        run: cat build/verify.txt >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no verify.txt" >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.runner }}-${{ matrix.cc }}
          path: |
            build/verify.txt
            build/results.tsv
            build/toolchain.txt
            build/logs/
